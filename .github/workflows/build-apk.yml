name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed APK (Release)
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Rota-12x60-Peugeot208.apk
          cp app/build/outputs/apk/release/app-release.apk Rota-12x60-Peugeot208-v2.apk
          ls -lh Rota-12x60-Peugeot208*.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rota-12x60-Peugeot208-APK
          path: Rota-12x60-Peugeot208-v2.apk

      - name: Publish APK to GitHub Releases (v2.0.0 & v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Rota-12x60-Peugeot208.apk Rota-12x60-Peugeot208-v2.apk --clobber
          fi
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 Rota-12x60-Peugeot208-v2.apk Rota-12x60-Peugeot208.apk --clobber
          else
            gh release create v2.0.0 Rota-12x60-Peugeot208-v2.apk Rota-12x60-Peugeot208.apk \
              --title "Rota 12x60 - Peugeot 208 (APK Android v2.0.0)" \
              --notes "Versão 2.0.0 assinada com chave fixa permanente: 2 pedágios (R$ 5,90 cada = R$ 11,80/trecho) e campos independentes de Seguro Mensal (R$ 120/mês), IPVA Anual e Licenciamento Anual."
          fi
