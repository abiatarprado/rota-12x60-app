name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed APK (Release)
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Rota-12x60-Peugeot208.apk
          ls -lh Rota-12x60-Peugeot208.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rota-12x60-Peugeot208-APK
          path: Rota-12x60-Peugeot208.apk

      - name: Publish APK to GitHub Releases (v1.0.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 Rota-12x60-Peugeot208.apk --clobber
          else
            gh release create v1.0.0 Rota-12x60-Peugeot208.apk \
              --title "Rota 12x60 - Peugeot 208 (APK Android v1.0.0)" \
              --notes "Aplicativo Android (.apk) personalizado para cálculo de custos do Peugeot 208 Allure 2013, caronas BlaBlaCar, Consignado Bradesco (40/119), troca de carro e estadia em Joinville na escala 12x12x12x60."
          fi
