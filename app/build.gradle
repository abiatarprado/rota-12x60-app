plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.rota12x60.app'
    compileSdk 34

    defaultConfig {
        applicationId "br.com.rota12x60.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    signingConfigs {
        releaseFixed {
            storeFile file("rota12x60-release.jks")
            storePassword "rota12x60pass"
            keyAlias "rota12x60"
            keyPassword "rota12x60pass"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.releaseFixed
        }
        debug {
            applicationIdSuffix ""
            signingConfig signingConfigs.releaseFixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
